<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Secagem Digital | API Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --accent: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 60px 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .api-pulse {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 12px;
            position: relative;
            box-shadow: 0 0 15px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .card-info {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-align: left;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .info-label {
            color: #64748b;
        }

        .info-value {
            color: var(--text);
            font-family: monospace;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #475569;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .mesh-gradient {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 210, 255, 0.03) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="mesh-gradient"></div>
    <div class="container">
        <div class="status-badge">
            <span class="api-pulse"></span>
            SISTEMA ATIVO
        </div>

        <h1>API Engine</h1>
        <div class="subtitle">Hub Secagem Digital</div>

        <div class="card-info">
            <div class="info-item">
                <span class="info-label">Interface</span>
                <span class="info-value">RESTful / JSON</span>
            </div>
            <div class="info-item">
                <span class="info-label">Ambiente</span>
                <span class="info-value">Production v1.0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Acesso</span>
                <span class="info-value">Restrict / Auth Required</span>
            </div>
        </div>

        <p style="font-size: 0.9rem; color: #475569; line-height: 1.6;">
            Este servidor é uma infraestrutura de backend. Acesso direto via interface web não é permitido. Por favor,
            utilize os aplicativos oficiais.
        </p>

        <div class="footer">
            &copy; 2026 Secagem Digital
        </div>
    </div>
</body>

</html>
